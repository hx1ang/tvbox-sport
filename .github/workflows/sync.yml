name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          collected_sites = {}

          # 1. 优先从 fty.json 中精准抓取核心 Guard 体育源（八八、多多、吃瓜）
          fty_target_keys = ["看球", "多多", "吃瓜"]
          try:
              req2 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/main/fty.json")
              data2 = json.loads(req2.read().decode("utf-8"))
              for site in data2.get("sites", []):
                  s_key = site.get("key", "")
                  if s_key in fty_target_keys:
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error fty: {e}")

          # 2. 从 xiaosa 中补充其他体育源（飞球、瓜子、咖啡等，同时防止网盘源混入）
          xiaosa_keys = ["飞球体育", "瓜子体育", "咖啡体育", "88看球"]
          try:
              req1 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data1 = json.loads(req1.read().decode("utf-8"))
              for site in data1.get("sites", []):
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  # 严格过滤掉带有网盘或4K影视的误伤
                  if s_key in xiaosa_keys and "4K" not in s_name and "盘" not in s_name:
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error xiaosa: {e}")

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": list(collected_sites.values()),
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print("Success! Total clean sports sites:", len(main_config["sites"]))
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync ultimate sports configuration with correct Guard apis" || echo "No changes to commit"
          git push
