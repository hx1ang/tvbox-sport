name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          # 兼容匹配 key 或完整 name（包含 🏀多多┃回放 等）
          target_keywords = ["88看球", "飞球体育", "瓜子体育", "咖啡体育", "看球", "多多", "吃瓜", "🏀多多┃回放", "⚽八八┃看球", "🏐吃瓜┃看球"]
          collected_sites = {}

          # 1. 抓取 xiaosa 源
          try:
              req1 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data1 = json.loads(req1.read().decode("utf-8"))
              for site in data1.get("sites", []):
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  if any(k in s_key or k in s_name for k in target_keywords):
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error 1: {e}")

          # 2. 抓取 fty 源
          try:
              req2 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/fty.json")
              data2 = json.loads(req2.read().decode("utf-8"))
              for site in data2.get("sites", []):
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  if any(k in s_key or k in s_name for k in target_keywords):
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error 2: {e}")

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": list(collected_sites.values()),
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print("Success! Total sites:", len(main_config["sites"]))
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync sport.json with full name matching" || echo "No changes to commit"
          git push
