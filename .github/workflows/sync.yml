name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          # 绝对精准匹配的 key 白名单（只收录这几个纯体育源，绝不带杂项）
          exact_keys = ["88看球", "飞球体育", "瓜子体育", "咖啡体育", "吃瓜", "多多", "Kanqiu", "Duoduo", "Chigua"]
          
          # 必须包含的精准体育后缀（防止单纯叫“多多”但不是体育源的混进来）
          required_tags = ["看球", "回放", "体育"]

          collected_sites = {}

          def filter_and_add(sites_list):
              for site in sites_list:
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  
                  # 必须满足：key 在白名单里，且名字里必须带有“看球”、“回放”或“体育”
                  is_exact_key = s_key in exact_keys
                  has_sport_tag = any(tag in s_name for tag in required_tags)
                  
                  # 如果是“戏曲多多”，它的 key 虽然叫多多，但 name 是“戏曲 • 多多”，没有体育标签，会被完美拦截！
                  if is_exact_key and has_sport_tag:
                      collected_sites[s_key] = site

          # 1. 抓取 xiaosa 源
          try:
              req1 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data1 = json.loads(req1.read().decode("utf-8"))
              filter_and_add(data1.get("sites", []))
          except Exception as e:
              print(f"Error 1: {e}")

          # 2. 抓取 fty 源
          try:
              req2 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/fty.json")
              data2 = json.loads(req2.read().decode("utf-8"))
              filter_and_add(data2.get("sites", []))
          except Exception as e:
              print(f"Error 2: {e}")

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": list(collected_sites.values()),
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print("Success! Total precise sports sites:", len(main_config["sites"]))
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync strictly filtered sports sites" || echo "No changes to commit"
          git push
