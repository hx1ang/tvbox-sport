name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          # 精准的目标源 key 列表（过滤掉云盘、影视、戏曲等无关项）
          target_keys = ["88看球", "飞球体育", "瓜子体育", "咖啡体育", "看球", "多多", "吃瓜"]
          
          # 必须包含的体育/回放/看球特征词，名称里必须带有这些才会被收录
          sport_keywords = ["看球", "回放", "体育", "Sports", "Guard"]
          
          collected_sites = {}

          def filter_and_add(sites_list):
              for site in sites_list:
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  
                  # 条件1：key 在我们指定的体育白名单里，或者 name 里明确带有体育特征
                  is_target_key = any(k in s_key for k in target_keys)
                  has_sport_tag = any(kw in s_name for kw in sport_keywords)
                  
                  # 严格排除网盘、4K影视等无关源
                  is_invalid = "4K" in s_name or "盘" in s_name or "影视" in s_name or "电影" in s_name
                  
                  if (is_target_key or has_sport_tag) and not is_invalid:
                      collected_sites[s_key] = site

          # 1. 抓取 xiaosa 源
          try:
              req1 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data1 = json.loads(req1.read().decode("utf-8"))
              filter_and_add(data1.get("sites", []))
          except Exception as e:
              print(f"Error 1: {e}")

          # 2. 抓取 fty 源
          try:
              req2 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/fty.json")
              data2 = json.loads(req2.read().decode("utf-8"))
              filter_and_add(data2.get("sites", []))
          except Exception as e:
              print(f"Error 2: {e}")

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": list(collected_sites.values()),
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print("Success! Total clean sports sites:", len(main_config["sites"]))
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync precise sports sites only" || echo "No changes to commit"
          git push
