name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          collected_sites = {}

          # 1. 动态抓取 fty.json，自动捕获上游最新的 spider 驱动路径，并赋值给 FTY 的 3 个源
          fty_spider = "https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt" # 默认兜底
          fty_mapping = {
              "看球": "⚽八八┃看球",
              "吃瓜": "🏐吃瓜┃看球",
              "多多": "🏀多多┃回放"
          }
          try:
              req_fty = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/fty.json")
              data_fty = json.loads(req_fty.read().decode("utf-8"))
              
              # 自动提取 fty.json 里的全局 spider 配置（支持带 md5 后缀的完整字符串）
              if "spider" in data_fty and data_fty["spider"]:
                  raw_spider = data_fty["spider"]
                  if raw_spider.startswith("./"):
                      fty_spider = "https://raw.githubusercontent.com/qist/tvbox/master/" + raw_spider[2:]
                  else:
                      fty_spider = raw_spider

              for site in data_fty.get("sites", []):
                  s_key = site.get("key", "")
                  if s_key in fty_mapping:
                      site["name"] = fty_mapping[s_key]
                      # 动态挂载上游最新的专属 jar 驱动（包含上游自带的 md5 校验）
                      site["jar"] = fty_spider
                      collected_sites[s_key] = site
              print("FTY sources and dynamic jar synced successfully.")
          except Exception as e:
              print(f"Error loading fty.json: {e}")

          # 2. 从 xiaosa 动态抓取其余 4 个标准体育源
          xiaosa_keys = ["88看球", "飞球体育", "瓜子体育", "咖啡体育"]
          try:
              req_xiaosa = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data_xiaosa = json.loads(req_xiaosa.read().decode("utf-8"))
              for site in data_xiaosa.get("sites", []):
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  if s_key in xiaosa_keys and "4K" not in s_name and "盘" not in s_name:
                      collected_sites[s_key] = site
              print("Xiaosa sources synced successfully.")
          except Exception as e:
              print(f"Error loading xiaosa api.json: {e}")

          # 3. 按固定 7 个源顺序整齐排列
          ordered_keys = ["88看球", "看球", "飞球体育", "瓜子体育", "咖啡体育", "吃瓜", "多多"]
          ordered_sites = [collected_sites[k] for k in ordered_keys if k in collected_sites]

          # 主配置：全局 spider 留给 xiaosa 体系
          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": ordered_sites,
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print(f"Success! Total 7 fully dynamic independent sports sites built.")
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync both xiaosa and fty sources with fully dynamic jars" || echo "No changes to commit"
          git push
