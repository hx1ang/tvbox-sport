name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          collected_sites = {}

          # 1. 独立抓取 fty.json 中的 3 个 Guard 核心源（看球、吃瓜、多多），完全保留其自身的 jar 和所有属性
          fty_keys = ["看球", "吃瓜", "多多"]
          try:
              req_fty = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/fty.json")
              data_fty = json.loads(req_fty.read().decode("utf-8"))
              for site in data_fty.get("sites", []):
                  s_key = site.get("key", "")
                  if s_key in fty_keys:
                      # 赋予干净规范的显示名称
                      if s_key == "看球":
                          site["name"] = "⚽八八┃看球"
                      elif s_key == "吃瓜":
                          site["name"] = "🏐吃瓜┃看球"
                      elif s_key == "多多":
                          site["name"] = "🏀多多┃回放"
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error loading fty.json: {e}")

          # 2. 独立抓取 xiaosa 中的 4 个标准体育源（88看球、飞球体育、瓜子体育、咖啡体育），完全保留其自身配置
          xiaosa_keys = ["88看球", "飞球体育", "瓜子体育", "咖啡体育"]
          try:
              req_xiaosa = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data_xiaosa = json.loads(req_xiaosa.read().decode("utf-8"))
              for site in data_xiaosa.get("sites", []):
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  if s_key in xiaosa_keys and "4K" not in s_name and "盘" not in s_name:
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error loading xiaosa api.json: {e}")

          # 严格按你想要的 7 个源顺序整齐排列
          ordered_keys = ["88看球", "看球", "飞球体育", "瓜子体育", "咖啡体育", "吃瓜", "多多"]
          ordered_sites = []
          for k in ordered_keys:
              if k in collected_sites:
                  ordered_sites.append(collected_sites[k])

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": ordered_sites,
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print(f"Success! Total independent sports sites: {len(ordered_sites)}")
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync independent 7 sports sources with native configs" || echo "No changes to commit"
          git push
