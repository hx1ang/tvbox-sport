name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          collected_sites = {}

          # 仅精准抓取 xiaosa 里的体育源（xiaosa 的源目前测试最稳定、能正常播放）
          xiaosa_keys = ["88看球", "飞球体育", "瓜子体育", "咖啡体育", "吃瓜", "多多"]
          
          try:
              req1 = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data1 = json.loads(req1.read().decode("utf-8"))
              for site in data1.get("sites", []):
                  if site.get("key") in xiaosa_keys:
                      collected_sites[site["key"]] = site
          except Exception as e:
              print(f"Error: {e}")

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": list(collected_sites.values()),
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print("Success! Total stable sites:", len(main_config["sites"]))
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Auto-sync stable xiaosa sports sites only" || echo "No changes to commit"
          git push
