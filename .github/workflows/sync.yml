name: Sync TVBox Main API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script and save json
        run: |
          python -c '
          import urllib.request
          import json

          collected_sites = {}
          common_jar = "https://xiuxiu-pro-new.meitudata.com/posters/224984cc747efdb5fb1a529803032e0f.jpg;md5;c9024ccf34209d26eb556c728c3f07fa"

          # 1. 简化的 FTY 核心源（共用同一个 jar 驱动）
          fty_guard_sources = [
              {"key": "看球", "name": "⚽八八┃看球", "api": "csp_KanqiuGuard"},
              {"key": "吃瓜", "name": "🏐吃瓜┃看球", "api": "csp_LiveGzGuard"},
              {"key": "多多", "name": "🏀多多┃回放", "api": "csp_DoubaoGuard"}
          ]

          for item in fty_guard_sources:
              collected_sites[item["key"]] = {
                  "key": item["key"],
                  "name": item["name"],
                  "type": 3,
                  "api": item["api"],
                  "searchable": 0,
                  "quickSearch": 0 if item["key"] != "看球" else None,
                  "changeable": 0,
                  "style": {"type": "list"},
                  "jar": common_jar
              }
              # 顺手清理掉值为 None 的键（保持格式干净）
              if collected_sites[item["key"]].get("quickSearch") is None:
                  del collected_sites[item["key"]]["quickSearch"]

          # 2. 从 xiaosa 动态抓取其余 4 个标准体育源
          xiaosa_keys = ["88看球", "飞球体育", "瓜子体育", "咖啡体育"]
          try:
              req_xiaosa = urllib.request.urlopen("https://raw.githubusercontent.com/qist/tvbox/master/xiaosa/api.json")
              data_xiaosa = json.loads(req_xiaosa.read().decode("utf-8"))
              for site in data_xiaosa.get("sites", []):
                  s_key = site.get("key", "")
                  s_name = site.get("name", "")
                  if s_key in xiaosa_keys and "4K" not in s_name and "盘" not in s_name:
                      collected_sites[s_key] = site
          except Exception as e:
              print(f"Error loading xiaosa api.json: {e}")

          # 3. 按固定 7 个源顺序排列
          ordered_keys = ["88看球", "看球", "飞球体育", "瓜子体育", "咖啡体育", "吃瓜", "多多"]
          ordered_sites = [collected_sites[k] for k in ordered_keys if k in collected_sites]

          main_config = {
              "spider": "https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar",
              "sites": ordered_sites,
              "parses": [
                  {"name": "聚合", "type": 3, "url": "json"},
                  {"name": "咸鱼", "type": 0, "url": "https://jx.xyflv.cc/?url="}
              ],
              "flags": ["qq", "qiyi", "youku", "mgtv", "letv", "pptv", "sohu", "bilibili"]
          }

          with open("sport.json", "w", encoding="utf-8") as f:
              json.dump(main_config, f, ensure_ascii=False, indent=4)
          print(f"Success! Cleaned up code, total 7 independent sports sites built.")
          '

      - name: Commit and push changes using native git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.data"
          git add sport.json
          git status
          git commit -m "Refactor script with shared jar variable for simplicity" || echo "No changes to commit"
          git push
